<!doctype html>
<html lang="en">
<head>
<script type="importmap">{ "imports": { "three": "../sim/vendor/three.module.min.js" } }</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mars HUD">
<link rel="manifest" href="manifest.webmanifest">
<title>Mars Walk HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/hud.css">
</head>
<body>
<canvas id="hud" aria-label="Astronaut heads-up display"></canvas>

<section id="start" class="start">
  <div class="start-card">
  <p class="kicker">GALE CRATER · MOUNT SHARP BOXWORK</p>
  <h1>MARS WALK HUD</h1>
  <p class="sub">Curiosity's boxwork route on Mount Sharp, walked on Earth.</p>
  <fieldset>
    <legend>MODE</legend>
    <label><input type="radio" name="mode" value="field"><span><b>Camera</b>walk outside, the HUD over the real view (GPS)</span></label>
    <label><input type="radio" name="mode" value="sim" checked><span><b>Sim</b>stay put, walk 3D Mars with keys or Ground Control</span></label>
    <label><input type="radio" name="mode" value="marswalk"><span><b>Mars walk</b>walk outside, see 3D Mars instead (GPS + VR box)</span></label>
  </fieldset>
  <fieldset>
    <legend>VIEW</legend>
    <label><input type="radio" name="view" value="vr" checked><span><b>VR box</b>two eyes</span></label>
    <label><input type="radio" name="view" value="single"><span><b>Hand-held</b>one screen</span></label>
  </fieldset>
  <button id="go" type="button">START THE WALK</button>
  <p class="note">Android Chrome. Start asks for camera, location and motion access. Press M for the test buttons.</p>
  <p id="startError" class="error" role="alert"></p>
  </div>
</section>

<div id="demo" class="demo" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
