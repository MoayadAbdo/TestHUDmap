<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mars Suit Assistant · Dev</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #14100e;
        --panel: #1f1a17;
        --border: #3a302a;
        --text: #eee6df;
        --muted: #a89a8f;
        --accent: #e0703a;
        --ok: #5cc28a;
        --warn: #e8b84a;
        --bad: #e5604f;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); }
      header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 16px; border-bottom: 1px solid var(--border); }
      header h1 { font-size: 18px; margin: 0; flex: 1 1 auto; }
      main { display: grid; gap: 16px; padding: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
      section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; min-width: 0; }
      section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
      button, select { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border); background: #2b241f; color: var(--text); cursor: pointer; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #1a0d05; font-weight: 600; }
      button:disabled { opacity: .45; cursor: not-allowed; }
      .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; border: 1px solid var(--border); }
      .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
      .pill[data-state="connected"]::before { background: var(--ok); }
      .pill[data-state="connecting"]::before, .pill[data-state="requesting-microphone"]::before, .pill[data-state="disconnecting"]::before { background: var(--warn); }
      .pill[data-error="true"]::before { background: var(--bad); }
      .badge { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: var(--warn); color: #1a1200; }
      .banner { padding: 8px 10px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; }
      .banner.warn { background: #3d3115; color: var(--warn); }
      .banner.bad { background: #3d1a15; color: var(--bad); }
      .log { list-style: none; margin: 0; padding: 0; max-height: 320px; overflow-y: auto; font-size: 14px; }
      .log li { padding: 6px 0; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
      .log .role { font-size: 11px; font-weight: 700; text-transform: uppercase; margin-right: 6px; }
      .log .user .role { color: #7db7e8; }
      .log .agent .role { color: var(--accent); }
      .log .event { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; }
      .log .event.error { color: var(--bad); }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 14px; }
      dt { color: var(--muted); }
      dd { margin: 0; font-variant-numeric: tabular-nums; }
      .alert { color: var(--bad); font-weight: 700; }
      .muted { color: var(--muted); font-size: 13px; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      ul.tasks { margin: 6px 0 0; padding-left: 18px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Mars Suit Assistant <span class="muted">· development console</span></h1>
      <span id="connection" class="pill" data-state="disconnected">disconnected</span>
      <button id="start" class="primary">Start Voice</button>
      <button id="stop" disabled>Stop Voice</button>
    </header>

    <main>
      <section>
        <h2>Conversation</h2>
        <div id="voice-error" class="banner bad" hidden></div>
        <ul id="transcript" class="log" aria-live="polite"></ul>
        <p id="transcript-empty" class="muted">Press Start Voice and speak. Transcripts appear here.</p>
      </section>

      <section>
        <h2>Stop ahead (walking to)</h2>
        <div id="offline-banner" class="banner warn" hidden>
          Voice assistant not connected. Showing the stop card from local mission data.
        </div>
        <div id="stop-card"></div>
      </section>

      <section>
        <h2>HUD status <span id="status-source" class="muted"></span></h2>
        <div id="status-error" class="banner bad" hidden></div>
        <dl id="status"></dl>
      </section>

      <section>
        <h2>Dev controls</h2>
        <div class="row">
          <label for="sim-stop" class="muted">Simulate walking to</label>
          <select id="sim-stop"></select>
        </div>
        <div class="row" style="margin-top: 10px">
          <label class="muted"><input type="checkbox" id="sim-outage" /> Simulate HUD status outage</label>
        </div>
        <h2 style="margin-top: 16px">Event log</h2>
        <ul id="events" class="log"></ul>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
